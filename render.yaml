# Render Blueprint for a single free Web Service.
#
# This uses Render's native Python runtime (simplest, lowest overhead). The
# included Dockerfile is an optional alternative - to use it instead, set
# `runtime: docker` and remove buildCommand/startCommand.
#
# Secrets (DISCORD_TOKEN, DISCORD_WEBHOOK_URL) use `sync: false`, so Render will
# prompt for them on first deploy and never store them in this file.

services:
  - type: web
    name: discord-python-runner
    runtime: python
    plan: free
    # A restart clears all in-memory state (rate-limit windows, concurrency
    # counter). That is expected and safe for this bot.
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m app.main"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Pin the interpreter used by Render's native runtime.
      - key: PYTHON_VERSION
        value: "3.12.7"

      # --- Secrets: entered in the Render dashboard, never committed. ---
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false

      # --- Behavior ---
      - key: OUTPUT_MODE
        value: bot
      - key: REQUIRE_PYTHON_CODE_BLOCK
        value: "true"
      - key: EXECUTE_ALL_BLOCKS
        value: "false"
      - key: LOG_LEVEL
        value: INFO

      # --- Limits ---
      - key: MAX_CODE_LENGTH
        value: "5000"
      - key: MAX_EXECUTION_TIME
        value: "5"
      - key: MAX_OUTPUT_LENGTH
        value: "8000"
      - key: MAX_MEMORY_MB
        value: "256"

      # --- Concurrency ---
      - key: MAX_CONCURRENT_EXECUTIONS
        value: "1"
      - key: MAX_QUEUE_SIZE
        value: "2"

      # --- Rate limiting ---
      - key: MAX_EXECUTIONS_PER_USER_PER_MINUTE
        value: "5"
      - key: MAX_GLOBAL_EXECUTIONS_PER_MINUTE
        value: "15"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
